name: Import ubuntu.slaves.black folder structure

on:
  push:
    paths:
      - '.ubuntu-slaves-black-import-trigger'

permissions:
  contents: write

jobs:
  import-folder-structure:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout target repository
        uses: actions/checkout@v4
        with:
          path: target
          fetch-depth: 0
      - name: Checkout source repository
        uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/Ubuntu.Determinant.Beta.Restricted
          path: source
          ref: main
          fetch-depth: 1
      - name: Recreate source folder structure only
        shell: bash
        run: |
          set -euo pipefail
          src='source/ubuntu.slaves.black'
          dst='target/ubuntu.slaves.black'
          mkdir -p "$dst"
          find "$src" -type d -print0 | sort -z | while IFS= read -r -d '' dir; do
            rel="${dir#"$src"/}"
            [ "$dir" = "$src" ] && continue
            mkdir -p "$dst/$rel"
          done
          find "$src" -type d -print0 | sort -z | while IFS= read -r -d '' dir; do
            rel="${dir#"$src"/}"
            [ "$dir" = "$src" ] && continue
            target_dir="$dst/$rel"
            if [ -z "$(find "$target_dir" -mindepth 1 -maxdepth 1 -print -quit)" ]; then
              printf '%s\n' 'Directory marker; source files intentionally not imported.' > "$target_dir/.gitkeep"
            fi
          done
          rm -rf source
      - name: Commit folder structure
        working-directory: target
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A ubuntu.slaves.black
          if git diff --cached --quiet; then
            echo 'No folder-structure changes to commit.'
            exit 0
          fi
          git commit -m 'Copy all ubuntu.slaves.black subdirectories A-Z'
          git push origin HEAD:main
